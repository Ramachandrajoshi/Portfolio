# Conventional Commits on main → a release PR with a generated CHANGELOG.md and version bump.
# Merging that PR tags a GitHub release. Deployment is independent (deploy.yml on every push).
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
