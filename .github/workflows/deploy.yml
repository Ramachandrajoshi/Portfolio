# Deploys main to GitHub Pages (source: GitHub Actions — no gh-pages branch).
# The artifact is validated and smoke-tested *before* it is uploaded.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel an in-progress production deployment.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Resolve the Pages URL (project path or custom domain)
        id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Not a secret: a Formspree form id is public by design. Set it as a repository variable.
          NEXT_PUBLIC_FORMSPREE_FORM_ID: ${{ vars.NEXT_PUBLIC_FORMSPREE_FORM_ID }}
      - name: Validate the exported artifact
        run: pnpm exec tsx scripts/check-export.ts && pnpm budgets
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Smoke-test the artifact under its real base path
        run: pnpm exec playwright test tests/e2e/routes.spec.ts --project=desktop
        env:
          E2E_SITE_URL: http://localhost:4173${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
