version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    commit-message:
      prefix: build
      include: scope
    groups:
      # Upgrade tightly coupled packages together so compatibility is tested as a set.
      next-react:
        patterns: [next, react, react-dom, eslint-config-next, '@types/react', '@types/react-dom']
      three:
        patterns: [three, '@types/three', '@react-three/*']
      content:
        patterns: [velite, shiki, '@shikijs/*', 'rehype-*', 'remark-*', mermaid, '@terrastruct/d2']
      testing:
        patterns: ['@playwright/test', '@axe-core/playwright', vitest, '@lhci/cli']
      lint:
        patterns: [eslint, prettier, prettier-plugin-tailwindcss, '@commitlint/*', husky, lint-staged]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
